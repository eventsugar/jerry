
<!DOCTYPE html>
<html>
<head>
  <title>Exam Study Guide</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f2;--surface:#ffffff;--border:#e8e5df;--text:#1a1916;--muted:#7a7770;
  --accent1:#2d5a3d;--accent1-light:#eaf3ed;
  --accent2:#3b4fa8;--accent2-light:#eceffe;
  --accent3:#8b3a1e;--accent3-light:#fdf0eb;
  --accent4:#5a2d82;--accent4-light:#f3eefb;
  --accent5:#1a5c6b;--accent5-light:#e8f5f8;
  --accent6:#2d6a5a;--accent6-light:#e8f5f2;
  --yellow:#f5a623;--yellow-light:#fef8ec;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:-.3px}
.topbar p{font-size:12px;color:var(--muted);margin-top:1px}
.course-tabs{display:flex;gap:6px;padding:16px 20px 0;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.course-tabs::-webkit-scrollbar{display:none}
.ctab{flex-shrink:0;padding:8px 14px;border-radius:8px 8px 0 0;border:1px solid transparent;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;background:var(--surface);color:var(--muted);border-color:var(--border);border-bottom-color:var(--bg)}
.ctab:hover{color:var(--text)}
.ctab.active{color:var(--surface);border-bottom-color:transparent}
.ctab.c0.active{background:var(--accent1);border-color:var(--accent1)}
.ctab.c1.active{background:var(--accent2);border-color:var(--accent2)}
.ctab.c2.active{background:var(--accent3);border-color:var(--accent3)}
.ctab.c3.active{background:var(--accent4);border-color:var(--accent4)}
.ctab.c4.active{background:var(--accent5);border-color:var(--accent5)}
.ctab.c5.active{background:var(--accent6);border-color:var(--accent6)}
.panel{display:none;padding:20px;animation:fadeIn .2s ease}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.course-header{border-radius:12px;padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.c0 .course-header{background:var(--accent1-light);border:1px solid #c5deca}
.c1 .course-header{background:var(--accent2-light);border:1px solid #c5ccf0}
.c2 .course-header{background:var(--accent3-light);border:1px solid #f0ccbc}
.c3 .course-header{background:var(--accent4-light);border:1px solid #d8c8f0}
.c4 .course-header{background:var(--accent5-light);border:1px solid #b8dce3}
.c5 .course-header{background:var(--accent6-light);border:1px solid #b0ddd4}
.course-title{font-size:16px;font-weight:600;letter-spacing:-.3px}
.course-meta{font-size:12px;color:var(--muted);margin-top:3px}
.exam-pill{font-size:11px;font-weight:500;padding:5px 12px;border-radius:20px;white-space:nowrap;background:rgba(0,0,0,.08)}

/* CLASSROOM LINK BUTTON */
.classroom-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:500;text-decoration:none;color:var(--surface);margin-bottom:14px;transition:opacity .15s}
.classroom-btn:hover{opacity:.85}
.classroom-btn svg{width:14px;height:14px;flex-shrink:0}
.c0 .classroom-btn{background:var(--accent1)}
.c1 .classroom-btn{background:var(--accent2)}
.c2 .classroom-btn{background:var(--accent3)}
.c3 .classroom-btn{background:var(--accent4)}
.c4 .classroom-btn{background:var(--accent5)}
.c5 .classroom-btn{background:var(--accent6)}

.sec-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.stab{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .15s}
.stab:hover{color:var(--text);border-color:var(--text)}
.stab.active{background:var(--text);color:var(--surface);border-color:var(--text)}
.sec{display:none}.sec.active{display:block}
.topics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.topic-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.topic-card h4{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.topic-num{font-family:'DM Mono',monospace;font-size:10px;background:var(--bg);border:1px solid var(--border);padding:2px 6px;border-radius:4px;color:var(--muted)}
.topic-card ul{padding-left:14px;font-size:12px;color:var(--muted);line-height:1.8}
.checklist-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.cl-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;justify-content:space-between}
.cl-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.cl-item:last-child{border-bottom:none}
.cl-item:hover{background:var(--bg)}
.cl-item input{accent-color:var(--text);width:14px;height:14px;flex-shrink:0;cursor:pointer}
.cl-label{font-size:13px}
.cl-label.done{text-decoration:line-through;color:var(--muted)}
.facts-grid{display:grid;gap:10px;margin-bottom:16px}
.fact{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;border-left:3px solid var(--text)}
.c0 .fact{border-left-color:var(--accent1)}.c1 .fact{border-left-color:var(--accent2)}.c2 .fact{border-left-color:var(--accent3)}.c3 .fact{border-left-color:var(--accent4)}.c4 .fact{border-left-color:var(--accent5)}.c5 .fact{border-left-color:var(--accent6)}
.fact h5{font-size:12px;font-weight:600;margin-bottom:4px}
.fact p{font-size:12px;color:var(--muted);line-height:1.7}
.exam-box{background:var(--yellow-light);border:1px solid #f0d090;border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:12px}
.exam-box h5{font-size:12px;font-weight:600;margin-bottom:8px;color:#8a5a00}
.exam-box table{width:100%;border-collapse:collapse}
.exam-box td{padding:3px 0;color:#6a4500}
.exam-box td:first-child{width:140px;font-weight:500}
.prog-bar-wrap{margin-bottom:16px}
.prog-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px}
.prog-bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.c0 .prog-bar-fill{background:var(--accent1)}.c1 .prog-bar-fill{background:var(--accent2)}.c2 .prog-bar-fill{background:var(--accent3)}.c3 .prog-bar-fill{background:var(--accent4)}.c4 .prog-bar-fill{background:var(--accent5)}.c5 .prog-bar-fill{background:var(--accent6)}
.prog-label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
</style>
</head>

<script>
const GC_ICON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm0 2h7v5h5v11H6V4zm2 8v2h8v-2H8zm0 4v2h5v-2H8z"/></svg>`;

const courses = [
  {
    id:"c0", code:"LAC 2221", name:"Christian Home and Family",
    exam:"Mon 4 May, 14:00–17:00", room:"Pavilion", inv:"Richard Kirya",
    classroom:"https://classroom.google.com/c/ODQxMDYxMDg4MDUy",
    assess:[["Daily reading","10%"],["Assignments","10%"],["Major projects","20%"],["Exam","60%"]],
    sections:{
      topics:[
        {num:"01",title:"Introduction & Biblical Foundations",points:["Christianity frames marriage as a lifelong covenant","Biblical morals underpin strong family life","Key texts: Genesis, Ephesians, Proverbs"]},
        {num:"02",title:"Cultural Teaching & Family",points:["African culture and Christian values compared","How cultural norms can align or conflict with scripture","Importance of community in family life"]},
        {num:"03",title:"Reconciling Culture and Bible",points:["Where culture and Bible differ — take the Bible","Apply biblical truth in an African cultural context","Avoid syncretism (mixing incompatible beliefs)"]},
        {num:"04",title:"Types of Family Structures",points:["Nuclear, extended, single-parent, blended","Strengths and weaknesses of each type","Christian ideal: stable, God-centred household"]},
        {num:"05",title:"Roles of Husband and Wife",points:["Husband: loving leader, provider, protector","Wife: supportive partner, manager of home","Mutual submission and respect (Eph 5)"]},
        {num:"06",title:"Marriage",points:["Choosing a partner: character over looks","Sustaining love through commitment not feeling","Christian sexuality and faithfulness"]},
        {num:"07",title:"Communication & Conflict",points:["Active listening is the foundation of good communication","Conflict is normal — resolution matters","Forgiveness as a practical daily tool"]},
        {num:"08",title:"Parenting & Moral Teaching",points:["Discipline with love, not harshness","Teaching values by example first, words second","Faith formation begins at home"]},
      ],
      keyfacts:[
        {q:"Main theme",a:"Building strong, God-centred families in an African context using biblical principles."},
        {q:"Key exam topics",a:"Roles of husband/wife, types of family structures, conflict resolution, and parenting principles."},
        {q:"Watch out for",a:"Be ready to compare cultural vs biblical family values — this is a common essay question."},
        {q:"Quick memory aid",a:"MRCP — Marriage, Roles, Communication, Parenting. Cover these 4 and you cover the exam."},
      ],
      checklist:["Read notes on Biblical family foundations","Understand roles of husband and wife","List strengths/weaknesses of each family structure","Study conflict resolution approaches","Review parenting and moral teaching","Practise a short essay comparing culture and Bible"],
    }
  },
  {
    id:"c1", code:"LAC 2233", name:"Research Methods",
    exam:"Tue 5 May, 14:00–17:00", room:"LA", inv:"Reuben Soita",
    classroom:"https://classroom.google.com/c/ODQwMTgxMzU3MTQ2",
    assess:[["Concept paper","10%"],["Literature review","10%"],["Draft proposal","10%"],["Proposal presentation","10%"],["Exam","60%"]],
    sections:{
      topics:[
        {num:"01",title:"Introduction to Research",points:["Research = systematic inquiry to solve a problem","Types: Applied (practical), Basic (theory), Strategic (policy)","Key terms: variable, hypothesis, methodology"]},
        {num:"02",title:"Research Planning & Hypothesis",points:["Identify a researchable area first","Formulate a clear, testable hypothesis","Write research purpose, objectives, and questions"]},
        {num:"03",title:"Literature Review",points:["LR = critically summarising existing knowledge on your topic","Sources: journals, books, theses, credible websites","Always cite using a consistent referencing style (APA/Harvard)"]},
        {num:"04",title:"Ethics in Research",points:["Informed consent — participants must agree knowingly","Confidentiality — protect identities","Avoid plagiarism and data fabrication"]},
        {num:"05",title:"Research Methodology",points:["Qualitative: words, meaning, small samples (interviews)","Quantitative: numbers, statistics, large samples (surveys)","Mixed methods: combines both"]},
        {num:"06",title:"Data Collection & Analysis",points:["Primary data: collected by you (interviews, surveys, observation)","Secondary data: already exists (books, reports)","Analysis: code, interpret, present findings clearly"]},
        {num:"07",title:"Report Writing",points:["Structure: Intro → Literature → Methodology → Findings → Conclusion","Use clear, formal academic language","Recommendations must follow from your findings"]},
      ],
      keyfacts:[
        {q:"Most tested area",a:"The research process steps in order, and the difference between qualitative and quantitative methods."},
        {q:"Referencing",a:"Know APA style basics — author, year, title, publisher. Expect a question on how to cite sources."},
        {q:"Ethics shortcut",a:"Remember RICE — Rights, Informed consent, Confidentiality, Ethical reporting."},
        {q:"Proposal structure",a:"Title → Background → Problem statement → Objectives → Methodology → Expected outcomes."},
      ],
      checklist:["Understand types of research (applied/basic/strategic)","Be able to write a hypothesis","Know the steps of a literature review","Study qualitative vs quantitative differences","Understand primary vs secondary data","Know the structure of a research proposal","Practise a data analysis summary paragraph"],
    }
  },
  {
    id:"c2", code:"ICT 2234", name:"Computer Organization & Architecture",
    exam:"Wed 6 May, 14:00–17:00", room:"LA", inv:"Enock Washeba",
    classroom:"https://classroom.google.com/c/ODQwOTI5NTE3MjI3",
    assess:[["Practical","10%"],["Test","10%"],["Assignments","10%"],["Project","10%"],["Exam","60%"]],
    sections:{
      topics:[
        {num:"01",title:"CPU Structure & the ALU",points:["CPU = brain of the computer (Control Unit + ALU + Registers)","ALU performs arithmetic (+, −, ×, ÷) and logic (AND, OR, NOT)","Registers: tiny super-fast storage inside the CPU (PC, MAR, MDR, ACC)"]},
        {num:"02",title:"Memory Hierarchy",points:["Fastest → Slowest: Registers → Cache → RAM → HDD","Cache stores recently used data to speed up CPU access","RAM is volatile (lost on power off); ROM is non-volatile"]},
        {num:"03",title:"Instruction Sets",points:["ISA defines the commands a CPU understands","RISC: few simple instructions, runs fast (ARM chips in phones)","CISC: many complex instructions (Intel x86 in PCs)"]},
        {num:"04",title:"Pipelining",points:["Overlapping instruction steps to increase throughput","Stages: Fetch → Decode → Execute → Write-back","Hazard: conflict between pipeline stages; solved by stalling or forwarding"]},
        {num:"05",title:"I/O Systems & Buses",points:["Bus = shared communication path (Data bus, Address bus, Control bus)","I/O devices connect via controllers/ports","DMA (Direct Memory Access) lets devices transfer data without CPU"]},
      ],
      keyfacts:[
        {q:"RISC vs CISC",a:"RISC = simple instructions, load/store architecture, used in mobile (ARM). CISC = complex instructions, backward compatible, used in desktops (x86)."},
        {q:"Memory speed order",a:"Registers (fastest) → L1 Cache → L2 Cache → RAM → SSD/HDD (slowest)."},
        {q:"Bus types",a:"Data bus carries data. Address bus carries memory addresses. Control bus carries control signals."},
        {q:"Pipelining analogy",a:"Like a car wash — each car (instruction) moves through stages simultaneously, increasing throughput."},
      ],
      checklist:["Draw and label the CPU internal structure","Explain the role of the ALU and CU","Describe the memory hierarchy with speeds","Compare RISC vs CISC with examples","Explain pipelining and name at least one hazard","Describe what a bus does and name the three types","Explain what DMA is and why it matters"],
    }
  },
  {
    id:"c3", code:"ICT 2242", name:"Systems Analysis and Design",
    exam:"Thu 7 May, 14:00–17:00", room:"LA", inv:"Enock Washeba",
    classroom:"https://classroom.google.com/c/ODQwOTQ2MTg0Nzcx",
    assess:[["Practical","10%"],["Test","10%"],["Assignments","10%"],["Project","10%"],["Exam","60%"]],
    sections:{
      topics:[
        {num:"01",title:"Systems Analysis Overview",points:["Systems analyst bridges users and developers","System = set of components working together toward a goal","SDLC phases: Planning → Analysis → Design → Implementation → Maintenance"]},
        {num:"02",title:"Feasibility Study",points:["Technical feasibility: Can we build it with current tech?","Economic feasibility: Is it cost-effective? (cost-benefit analysis)","Operational feasibility: Will users actually use it?"]},
        {num:"03",title:"Analysis Activities",points:["Requirements gathering: interviews, questionnaires, observation, document review","Sampling: studying a subset of data to understand the whole","Fact-finding leads to a formal System Requirements Specification (SRS)"]},
        {num:"04",title:"Data Flow & DFDs",points:["DFD = graphical view of how data moves through a system","Symbols: circle (process), rectangle (external entity), open box (data store), arrow (data flow)","Level 0 = context diagram (big picture); Level 1 = detailed flows"]},
        {num:"05",title:"Data Dictionaries",points:["Formal repository describing every data element in the system","Defines: name, type, length, format, range, default","Essential for developers and analysts to share a common language"]},
        {num:"06",title:"Input, Output & Interface Design",points:["Good output = right info, right person, right time, right format","Input design minimises errors (validation, verification)","UI principles: consistency, feedback, simplicity"]},
        {num:"07",title:"Database & Prototyping",points:["Prototype = working model shown to users early for feedback","Databases designed using ER diagrams at this stage","Normalization reduces redundancy (1NF, 2NF, 3NF)"]},
        {num:"08",title:"Testing, Integration & Implementation",points:["Unit test → Integration test → System test → UAT","Changeover strategies: direct, parallel, phased, pilot","Post-implementation review: did the system meet goals?"]},
      ],
      keyfacts:[
        {q:"SDLC in order",a:"Planning → Analysis → Design → Implementation → Maintenance. Know what happens at each stage."},
        {q:"DFD symbols",a:"Circle = process, Rectangle = external entity, Open box = data store, Arrow = data flow. Draw from memory!"},
        {q:"3 feasibilities",a:"Technical (can we?), Economic (is it worth it?), Operational (will they use it?)."},
        {q:"Testing order",a:"Unit → Integration → System → UAT. Each stage catches different types of errors."},
      ],
      checklist:["List and explain all SDLC phases","Draw a Level 0 DFD for a simple system","Name all DFD symbols and what they mean","Explain the three types of feasibility","Describe at least 3 fact-finding methods","Explain normalization up to 3NF","Name the four changeover strategies","List the testing levels in correct order"],
    }
  },
  {
    id:"c4", code:"ICT 2291", name:"Systems Administration",
    exam:"Fri 8 May, 14:00–17:00", room:"LA", inv:"Clement Barasa",
    classroom:"https://classroom.google.com/c/ODE4ODQ3NjczMjQ4",
    assess:[["Practical","10%"],["Test","10%"],["Assignments","10%"],["Project","10%"],["Exam","60%"]],
    sections:{
      topics:[
        {num:"01",title:"Course Overview & Admin Roles",points:["SysAdmin = person responsible for keeping systems running","Responsibilities: installation, configuration, monitoring, backups, security","Two audiences: the technology AND the users who use it"]},
        {num:"02",title:"System Proposal & Life Cycle",points:["Before installing: write a systems proposal (scope, cost, timeline)","Apply SDLC to plan network deployment","Document everything — configurations, decisions, changes"]},
        {num:"03",title:"Output & Input Design",points:["Design reports/screens so users can do their jobs effectively","Input design: minimise data entry errors with validation","Online forms: clear labels, logical flow, error messages"]},
        {num:"04",title:"Database Design",points:["SysAdmins manage database servers (MySQL, PostgreSQL, MSSQL)","Understand schemas, tables, users, and permissions","Regular backups of databases are critical"]},
        {num:"05",title:"Human-Computer Interaction",points:["HCI: designing systems that are usable by real people","Key principles: learnability, efficiency, memorability, error tolerance","User testing reveals problems before deployment"]},
        {num:"06",title:"Data Entry & Accuracy",points:["Validation: rules that check data before it's stored (range, format, type checks)","Verification: double-checking data is correct (visual check, double entry)","Garbage in = garbage out — accurate data entry is essential"]},
        {num:"07",title:"Software Engineering & Quality",points:["Structured SE: modular code, documentation, version control","QA: testing at every stage, not just at the end","Tools: Git, ticketing systems, automated test scripts"]},
        {num:"08",title:"User Training & Implementation",points:["Train users before go-live, not after problems arise","Methods: classroom, one-on-one, manuals, video tutorials","Implementation: install OS, configure services, set up user accounts, apply security policies"]},
      ],
      keyfacts:[
        {q:"Core admin tasks",a:"Install → Configure → Monitor → Maintain → Secure. Repeat daily."},
        {q:"Validation vs verification",a:"Validation = checking data follows rules (e.g. age must be a number). Verification = checking it's actually correct (e.g. re-entering a password)."},
        {q:"HCI principles",a:"Learnability, Efficiency, Memorability, Low error rate, Satisfaction (Nielsen's 5 usability goals)."},
        {q:"Why train users?",a:"Untrained users cause more downtime than hardware failures. Training is a core sysadmin responsibility."},
      ],
      checklist:["Define the role of a systems administrator","List at least 5 daily sysadmin responsibilities","Explain validation vs verification with examples","Describe HCI principles and why they matter","Explain structured software engineering steps","Describe a user training plan for a new system","Explain what to document during implementation"],
    }
  },
  {
    id:"c5", code:"ICT 2254", name:"Mobile Networks and Computing",
    exam:"Mon 11 May, 14:00–17:00", room:"LA", inv:"Fred Gizamba",
    classroom:"https://classroom.google.com/c/NzkzMjgxMTk0MTE3",
    assess:[["Quizzes","10%"],["Test","10%"],["Assignments","10%"],["Project","10%"],["Exam","60%"]],
    sections:{
      topics:[
        {num:"01",title:"Mobile Computing Fundamentals",points:["Mobile computing = computing on the move using wireless networks","Key characteristics: portability, connectivity, interactivity","Constraints: limited battery, bandwidth, screen size"]},
        {num:"02",title:"Bluetooth & Zigbee",points:["Bluetooth: short-range (~10m), used for headphones, file transfer (2.4 GHz)","Zigbee: low-power, mesh network for IoT devices (smart home sensors)","Both are short-range; Zigbee supports more simultaneous devices"]},
        {num:"03",title:"Wi-Fi Technologies",points:["IEEE 802.11 standards: a/b/g/n/ac/ax (Wi-Fi 6)","Operates at 2.4 GHz (longer range) or 5 GHz (faster, shorter range)","WPA3 is the current encryption standard for Wi-Fi security"]},
        {num:"04",title:"GSM / GPRS / 3G / 3GPP",points:["GSM (2G): voice calls and SMS, circuit-switched","GPRS (2.5G): adds basic data (email, WAP)","3G/3GPP: broadband mobile data, video calls, speeds up to ~2 Mbps"]},
        {num:"05",title:"Mobile IP",points:["Allows a device to keep the same IP address while moving between networks","Uses a Home Agent (HA) and Foreign Agent (FA)","Essential for uninterrupted calls/connections while travelling"]},
        {num:"06",title:"Wireless ATM",points:["ATM = Asynchronous Transfer Mode — fixed-size 53-byte cells","Wireless ATM extends ATM to radio links for QoS guarantees","Used in environments needing predictable delay (voice, video)"]},
        {num:"07",title:"J2ME / J2EE Platforms",points:["J2ME (Java Micro Edition): for small mobile devices (phones, PDAs)","J2EE (Java Enterprise Edition): for server-side mobile services","MIDP (Mobile Info Device Profile) is the J2ME API for phones"]},
        {num:"08",title:"Mobile Architectures: WAP, SMS, I-mode",points:["WAP: Wireless Application Protocol — early mobile internet standard","SMS: text messaging over GSM signalling channel","I-mode: Japan's proprietary mobile internet — always-on data"]},
        {num:"09",title:"GSM Gateways (Kannel)",points:["GSM gateway connects IP networks to the mobile network","Kannel: open-source WAP/SMS gateway software","Allows web applications to send/receive SMS programmatically"]},
      ],
      keyfacts:[
        {q:"Generation comparison",a:"1G=voice only, 2G=voice+SMS, 2.5G=basic data, 3G=mobile broadband, 4G=LTE high-speed, 5G=ultra low latency."},
        {q:"Bluetooth vs Zigbee",a:"Bluetooth = media/files (higher bandwidth). Zigbee = IoT sensors (ultra low power, mesh). Both use 2.4 GHz."},
        {q:"Mobile IP agents",a:"Home Agent (HA) = at home network. Foreign Agent (FA) = at visited network. Together they route packets to the moving device."},
        {q:"J2ME shortcut",a:"CLDC (hardware profile) + MIDP (software API) = J2ME stack for phones. Think: CLDC is the engine, MIDP is the dashboard."},
      ],
      checklist:["List generations 1G–5G with key features of each","Explain Bluetooth vs Zigbee use cases","Describe Wi-Fi 802.11 standards and frequencies","Explain how Mobile IP works (HA and FA)","Describe WAP, SMS, and I-mode architectures","Explain J2ME stack (CLDC + MIDP)","Describe what a GSM gateway does"],
    }
  },
];

const state={course:0,sec:{},checks:{}};

function init(){
  courses.forEach((_,i)=>{state.sec[i]='topics';state.checks[i]={};});
  renderTabs();renderPanels();setActive(0);
}

function renderTabs(){
  document.getElementById('ctabs').innerHTML=courses.map((c,i)=>`
    <div class="ctab ${c.id}" id="ctab-${i}" onclick="setActive(${i})">
      <span style="font-family:monospace;font-size:10px;opacity:.7">${c.code}</span><br>
      ${c.name.split(' ').slice(0,3).join(' ')}${c.name.split(' ').length>3?'…':''}
    </div>`).join('');
}

function renderPanels(){
  document.getElementById('panels').innerHTML=courses.map((c,i)=>{
    const topicsHtml=c.sections.topics.map(t=>`
      <div class="topic-card">
        <h4><span class="topic-num">${t.num}</span>${t.title}</h4>
        <ul>${t.points.map(p=>`<li>${p}</li>`).join('')}</ul>
      </div>`).join('');
    const factsHtml=c.sections.keyfacts.map(f=>`
      <div class="fact"><h5>${f.q}</h5><p>${f.a}</p></div>`).join('');
    const checks=c.sections.checklist.map((item,j)=>`
      <div class="cl-item" onclick="toggleCheck(${i},${j})">
        <input type="checkbox" id="chk-${i}-${j}" onclick="event.stopPropagation();toggleCheck(${i},${j})">
        <span class="cl-label" id="lbl-${i}-${j}">${item}</span>
      </div>`).join('');
    return `
    <div class="panel ${c.id}" id="panel-${i}">
      <div class="course-header">
        <div>
          <div class="course-title">${c.name}</div>
          <div class="course-meta">${c.code} &nbsp;·&nbsp; Year 2 &nbsp;·&nbsp; 3 Credit Units &nbsp;·&nbsp; ${c.inv}</div>
        </div>
        <div class="exam-pill">${c.exam}</div>
      </div>

      <a class="classroom-btn" href="${c.classroom}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm0 2h7v5h5v11H6V4zm2 8v2h8v-2H8zm0 4v2h5v-2H8z"/></svg>
        Open Google Classroom &nbsp;↗
      </a>

      <div class="exam-box">
        <h5>Assessment breakdown</h5>
        <table>${c.assess.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td></tr>`).join('')}</table>
      </div>

      <div class="sec-tabs">
        <div class="stab active" id="st-${i}-topics" onclick="setSec(${i},'topics')">Topics</div>
        <div class="stab" id="st-${i}-keyfacts" onclick="setSec(${i},'keyfacts')">Key Facts</div>
        <div class="stab" id="st-${i}-checklist" onclick="setSec(${i},'checklist')">Checklist</div>
      </div>

      <div class="sec active" id="sec-${i}-topics"><div class="topics-grid">${topicsHtml}</div></div>
      <div class="sec" id="sec-${i}-keyfacts"><div class="facts-grid">${factsHtml}</div></div>
      <div class="sec" id="sec-${i}-checklist">
        <div class="prog-bar-wrap">
          <div class="prog-label"><span>Revision progress</span><span id="prog-lbl-${i}">0 / ${c.sections.checklist.length}</span></div>
          <div class="prog-bar-bg"><div class="prog-bar-fill" id="prog-${i}" style="width:0%"></div></div>
        </div>
        <div class="checklist-wrap">
          <div class="cl-header"><span>Study checklist</span><span style="font-weight:400;color:var(--muted)">${c.sections.checklist.length} items</span></div>
          ${checks}
        </div>
      </div>
    </div>`;
  }).join('');
}

function setActive(i){
  state.course=i;
  document.querySelectorAll('.ctab').forEach((t,j)=>t.classList.toggle('active',j===i));
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));
}

function setSec(ci,sec){
  state.sec[ci]=sec;
  ['topics','keyfacts','checklist'].forEach(s=>{
    document.getElementById(`st-${ci}-${s}`)?.classList.toggle('active',s===sec);
    document.getElementById(`sec-${ci}-${s}`)?.classList.toggle('active',s===sec);
  });
}

function toggleCheck(i,j){
  const chk=document.getElementById(`chk-${i}-${j}`);
  const lbl=document.getElementById(`lbl-${i}-${j}`);
  if(!chk||!lbl)return;
  const now=!chk.checked;
  chk.checked=now;
  lbl.classList.toggle('done',now);
  if(!state.checks[i])state.checks[i]={};
  state.checks[i][j]=now;
  const total=courses[i].sections.checklist.length;
  const done=Object.values(state.checks[i]).filter(Boolean).length;
  const pct=Math.round(done/total*100);
  document.getElementById(`prog-${i}`).style.width=pct+'%';
  document.getElementById(`prog-lbl-${i}`).textContent=`${done} / ${total}`;
}

init();
</script>
</body>
</html>
